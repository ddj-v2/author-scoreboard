<div class="row">
  <div class="medium-12 columns">
    <div class="section" id="ranking_author">
      <div class="section__body no-padding" data-fragment-id="ranking_author">
        <iframe src="./ranking/author" id="authorRankingIframe" style="width:100%;border:0;" loading="lazy" title="Author Ranking"></iframe>
      </div>
      <script>
        (function(){
          const iframe = document.getElementById('authorRankingIframe');
          if (!iframe) return;

          // Preferred: use postMessage from inner page to set height accurately.
          function onMessage(e) {
            try {
              const data = e.data || {};
              if (data && data.source === 'authorRanking' && typeof data.height === 'number') {
                iframe.style.height = data.height + 'px';
              }
              if (data && data.source === 'authorRanking' && data.navigateTo) {
                // navigate top-level when inner page requests navigation
                try { window.top.location.href = data.navigateTo; } catch (err) { window.location.href = data.navigateTo; }
              }
            } catch (err) {}
          }
          window.addEventListener('message', onMessage, false);

          // Fallback: attempt same-origin inspection and periodic resize
          function resize() {
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
              iframe.style.height = h + 'px';
            } catch (e) {
              // cross-origin or not ready
            }
          }

          iframe.addEventListener('load', () => { resize(); });
          const tid = setInterval(resize, 700);

          window.addEventListener('beforeunload', () => { clearInterval(tid); window.removeEventListener('message', onMessage); });
        })();
      </script>
    </div>
  </div>
</div>
